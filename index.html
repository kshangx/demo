<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hCaptcha Checkbox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600&family=Roboto:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #f3f3f3;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Perfected bounding box measurements */
        .captcha-container {
            box-sizing: border-box;
            width: 302px;
            height: 76px;
            background-color: #ffffff;
            border: 1px solid #d3d3d3;
            border-radius: 3px; /* hCaptcha uses a very sharp 3px border radius, not 10px */
            box-shadow: 0 0 4px 1px rgba(0, 0, 0, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 12px 0 12px;
        }

        /* Left side content alignment */
        .left-content {
            display: flex;
            align-items: center;
        }

        .checkbox {
            box-sizing: border-box;
            width: 28px;
            height: 28px;
            border: 2px solid #c1c1c1;
            border-radius: 2px;
            background-color: #ffffff;
            cursor: pointer;
            margin-right: 12px;
            transition: border-color 0.2s ease;
        }

        .checkbox:hover {
            border-color: #a6a6a6;
        }

        .text-group {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        .main-text {
            color: #000000;
            font-size: 14px;
            font-weight: 600;
        }

        .sub-text {
            color: #757575;
            font-size: 10px;
            font-weight: 400;
            margin-top: 2px;
        }

        /* Right side branding section */
        .right-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 55px; /* Fixed standard width for the brand column */
            margin-right: 2px;
        }

        /* Using the exact SVG structure hCaptcha uses for crispness */
        .hcaptcha-logo {
            width: 24px;
            height: 22px;
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            /* Direct official vector representation color */
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><path fill="%23424242" d="M16 0C7.16 0 0 7.16 0 16s7.16 16 16 16 16-7.16 16-16S24.84 0 16 0zm-2 22.58l-5.3-5.3 2.12-2.12 3.18 3.18 7.18-7.18 2.12 2.12L14 22.58z"/></svg>');
            margin-bottom: 2px;
        }

        .brand-name {
            color: #424242;
            font-size: 8px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: none;
            margin-bottom: 3px;
        }

        .links {
            font-size: 7.5px;
            color: #616161;
            display: flex;
            gap: 3px;
        }

        .links a {
            color: #616161;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="captcha-container">
        
        <div class="left-content">
            <div class="checkbox"></div>
            <div class="text-group">
                <span class="main-text">I am human</span>
                <span class="sub-text">Click to verify</span>
            </div>
        </div>

        <div class="right-content">
            <div class="hcaptcha-logo"></div>
            <span class="brand-name">hCaptcha</span>
            <div class="links">
                <a href="https://hcaptcha.com/privacy" target="_blank">Privacy</a>
                <span>•</span>
                <a href="https://hcaptcha.com/terms" target="_blank">Terms</a>
            </div>
        </div>

    </div>

</body>
</html>
