<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify you are human to continue</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 8px;
      background: #ffffff;
      font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
      color: #000000;
    }

    h1 {
      font-size: 30px;
      font-weight: 700;
      margin: 14px 0 20px 0;
      letter-spacing: -0.2px;
    }

    /* reCAPTCHA widget */
    .recaptcha {
      width: 340px;
      height: 64px;
      background: #f9f9f9;
      border: 1px solid #d3d3d3;
      border-radius: 3px;
      box-shadow: 0 0 4px 1px rgba(0, 0, 0, 0.06);
      display: flex;
      align-items: center;
      font-size: 14px;
      color: #000000;
      user-select: none;
    }

    .recaptcha-checkbox {
      width: 24px;
      height: 24px;
      margin-left: 12px;
      margin-right: 12px;
      background: #fff;
      border: 1px solid #c1c1c1;
      border-radius: 2px;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* "checking" spinner shown after click */
    .recaptcha-checkbox.checking {
      border-color: transparent;
      border-top: 3px solid #4285f4;
      border-right: 3px solid #4285f4;
      border-bottom: 3px solid #c1c1c1;
      border-left: 3px solid #c1c1c1;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .recaptcha-label {
      flex: 1;
      line-height: 1.3;
    }

    .recaptcha-logo {
      width: 70px;
      margin-right: 12px;
      text-align: center;
      color: #9c9c9c;
    }

    .recaptcha-logo .brand {
      font-size: 11px;
      letter-spacing: 0.3px;
    }

    .recaptcha-logo .legal {
      font-size: 9px;
      margin-top: 3px;
    }
  </style>
</head>
<body>
  <h1>Verify you are human to continue</h1>

  <div class="recaptcha">
    <div class="recaptcha-checkbox" id="checkbox"></div>
    <div class="recaptcha-label">I'm not a robot</div>
    <div class="recaptcha-logo">
      <div class="brand">reCAPTCHA</div>
      <div class="legal">Privacy - Terms</div>
    </div>
  </div>

  <script>
    var REDIRECT_URL = "http://www.bitdefender-testing.com/malware/";
    var checkbox = document.getElementById("checkbox");

    checkbox.addEventListener("click", function () {
      window.location.href = REDIRECT_URL;
    });
  </script>
</body>
</html>
